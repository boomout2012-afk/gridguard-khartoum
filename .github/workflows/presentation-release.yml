# Retains the original release contract and its historical artifact checks.
# Current submission verification is documented in docs/REVIEWER_GUIDE.md.
name: Historical presentation release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-release
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: [self-hosted, Windows, X64, gridguard-presentation-gpu]
    timeout-minutes: 120
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.10"
          enable-cache: true

      - name: Verify and build the historical presentation package
        shell: pwsh
        run: .\scripts\build-presentation.ps1
