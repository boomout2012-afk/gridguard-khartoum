name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.10"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra docs

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run portable tests
        env:
          CUDA_VISIBLE_DEVICES: "-1"
        run: uv run --no-sync pytest -m "not gpu and not source_archive and not release_artifact"

      - name: Build wheel and source archive
        env:
          PIP_NO_INDEX: "1"
        run: uv run --no-sync --offline -- uv build --offline --no-index --no-build-isolation
