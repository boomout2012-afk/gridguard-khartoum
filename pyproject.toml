[project]
name = "gridguard-khartoum"
version = "1.2.0"
description = "Offline PPO load-shedding decision-support simulation for Khartoum State"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cupy-cuda12x[ctk]>=13.6,<16",
  "numpy>=2.0,<3",
  "PySide6-Essentials>=6.8,<7",
  "torch==2.8.0",
]

[project.optional-dependencies]
dev = [
  "hatchling==1.32.0",
  "pyinstaller>=6.15,<7",
  "pytest>=8.4,<10",
  "pytest-qt>=4.5,<5",
  "ruff>=0.12,<1",
]
docs = [
  "pdfplumber>=0.11,<1",
  "pypdf>=6,<7",
  "PyYAML>=6,<7",
  "reportlab>=4.4,<5",
]

[project.scripts]
gridguard-desktop = "gridguard.ui.app:main"
gridguard-doctor = "gridguard.cli:doctor_main"
gridguard-evaluate = "gridguard.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridguard"]
exclude = ["src/gridguard/assets/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["/RELEASE_MANIFEST.json"]

[tool.hatch.build.targets.wheel.force-include]
"data/evidence/frozen-benchmark.json" = "gridguard/_bundled/data/evidence/frozen-benchmark.json"
"data/evidence/paired-benchmark.json" = "gridguard/_bundled/data/evidence/paired-benchmark.json"
"data/evidence/robustness-supplement.json" = "gridguard/_bundled/data/evidence/robustness-supplement.json"
"data/evidence/source-manifest.json" = "gridguard/_bundled/data/evidence/source-manifest.json"
"data/model/manifest.json" = "gridguard/_bundled/data/model/manifest.json"
"data/model/ppo-policy.npz" = "gridguard/_bundled/data/model/ppo-policy.npz"
"data/model/training-provenance.yaml" = "gridguard/_bundled/data/model/training-provenance.yaml"
"docs/source/graduation-project-proposal.pdf" = "gridguard/_bundled/docs/source/graduation-project-proposal.pdf"
"src/gridguard/assets/fonts/AtkinsonHyperlegible-Bold.ttf" = "gridguard/assets/fonts/AtkinsonHyperlegible-Bold.ttf"
"src/gridguard/assets/fonts/AtkinsonHyperlegible-Regular.ttf" = "gridguard/assets/fonts/AtkinsonHyperlegible-Regular.ttf"
"src/gridguard/assets/fonts/IBMPlexMono-Regular.ttf" = "gridguard/assets/fonts/IBMPlexMono-Regular.ttf"
"src/gridguard/assets/fonts/IBMPlexMono-SemiBold.ttf" = "gridguard/assets/fonts/IBMPlexMono-SemiBold.ttf"
"src/gridguard/assets/fonts/SourceSerif4-Regular.ttf" = "gridguard/assets/fonts/SourceSerif4-Regular.ttf"
"src/gridguard/assets/fonts/SourceSerif4-Semibold.ttf" = "gridguard/assets/fonts/SourceSerif4-Semibold.ttf"
"src/gridguard/assets/fonts/THIRD_PARTY_FONTS.md" = "gridguard/assets/fonts/THIRD_PARTY_FONTS.md"
"src/gridguard/assets/fonts/licenses/AtkinsonHyperlegible-OFL.txt" = "gridguard/assets/fonts/licenses/AtkinsonHyperlegible-OFL.txt"
"src/gridguard/assets/fonts/licenses/IBMPlexMono-license.txt" = "gridguard/assets/fonts/licenses/IBMPlexMono-license.txt"
"src/gridguard/assets/fonts/licenses/SourceSerif4-LICENSE.md" = "gridguard/assets/fonts/licenses/SourceSerif4-LICENSE.md"
"src/gridguard/assets/map/THIRD_PARTY_DATA.md" = "gridguard/assets/map/THIRD_PARTY_DATA.md"
"src/gridguard/assets/map/khartoum-localities.geojson" = "gridguard/assets/map/khartoum-localities.geojson"
"src/gridguard/assets/map/khartoum-nile.geojson" = "gridguard/assets/map/khartoum-nile.geojson"
"src/gridguard/assets/map/map-provenance.json" = "gridguard/assets/map/map-provenance.json"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
  "gpu: requires the presentation NVIDIA GPU and validated CUDA stack",
  "release_artifact: requires the complete final Windows release tree and bound artifacts",
  "source_archive: requires the trusted read-only source research archive",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
